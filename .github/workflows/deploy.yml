name: Deploy to Fasthosts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Normalize server dir
        id: dir
        env:
          RAW: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          DIR="${RAW:-/}"
          # Normalize to a trailing slash so the path is unambiguously a directory.
          [ "${DIR%/}" = "$DIR" ] && DIR="$DIR/"
          echo "::add-mask::$DIR"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload dist/ to Fasthosts
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          # lftp reads the password from this variable, so it never hits argv.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEST: ${{ steps.dir.outputs.path }}
        run: |
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 20;
            set net:reconnect-interval-base 5;
            set ftp:passive-mode true;
            mirror --reverse --verbose --parallel=1 ./dist/ $DEST;
            bye
          "
