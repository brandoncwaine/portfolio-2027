name: Deploy to Fasthosts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Normalize server dir
        id: dir
        env:
          RAW: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          DIR="${RAW:-/}"
          # The FTP action requires a trailing slash to treat it as a folder.
          [ "${DIR%/}" = "$DIR" ] && DIR="$DIR/"
          echo "::add-mask::$DIR"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload dist/ to Fasthosts
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ steps.dir.outputs.path }}
          # Keeps a manifest on the server so only changed files upload.
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
